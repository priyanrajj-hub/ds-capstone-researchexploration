<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Friend Recommendation System 3D</title>
  
  <!-- 3D Force Graph & Three.js dependencies via CDN -->
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/3d-force-graph"></script>

  <style>
    /* Global Styles */
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #050505;
      color: #fff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    
    #3d-graph {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Glassmorphism Control Panel */
    #control-panel {
      position: absolute;
      top: 30px;
      left: 30px;
      width: 320px;
      background: rgba(20, 20, 20, 0.65);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h2 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 600;
      color: #f1f3f5;
      text-shadow: 0 0 10px rgba(255,255,255,0.2);
      letter-spacing: 0.5px;
    }

    /* Platform Toggle */
    .toggle-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .toggle-group button {
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.05);
      background: rgba(255,255,255,0.05);
      color: #adb5bd;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.95rem;
      font-weight: 500;
      text-align: left;
    }
    
    .toggle-group button:hover {
      background: rgba(255,255,255,0.1);
    }
    
    .toggle-group button.active {
      background: rgba(77, 171, 247, 0.15);
      color: #4dabf7;
      border-color: rgba(77, 171, 247, 0.4);
      box-shadow: 0 0 15px rgba(77, 171, 247, 0.2);
    }

    /* Action Button */
    #btn-run {
      padding: 14px;
      background: linear-gradient(135deg, #40c057 0%, #2f9e44 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(64,192,87,0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    #btn-run:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(64,192,87,0.5);
    }

    #btn-run:disabled {
      background: rgba(255,255,255,0.1);
      color: #666;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Metrics Readout */
    .metrics {
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 15px;
    }
    
    .metrics p {
      margin: 12px 0;
      font-size: 0.95rem;
      color: #adb5bd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .metrics span {
      color: #fff;
      font-weight: 600;
      background: rgba(255,255,255,0.1);
      padding: 4px 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 1rem;
    }

    .metrics span.highlight-metric {
      color: #40c057;
      background: rgba(64, 192, 87, 0.15);
      border: 1px solid rgba(64, 192, 87, 0.3);
    }
    
    .metrics span.highlight-select {
      color: #4dabf7;
      background: rgba(77, 171, 247, 0.15);
      border: 1px solid rgba(77, 171, 247, 0.3);
    }
  </style>
</head>
<body>

  <!-- 3D Canvas Container -->
  <div id="3d-graph"></div>

  <!-- UI Constraints -->
  <div id="control-panel">
    <h2>Rec-Engine 3D</h2>
    
    <div class="toggle-group">
      <button id="btn-linkedin" class="active">LinkedIn Mode (Symmetric)</button>
      <button id="btn-instagram">Instagram Mode (Directed)</button>
    </div>
    
    <button id="btn-run" disabled>Run Link Prediction</button>
    
    <div class="metrics">
      <p>Selected User: <span id="val-selected">None</span></p>
      <p>Candidates (BFS): <span id="val-candidates">0</span></p>
      <p>Top Rec: <span id="val-top">None</span></p>
    </div>
  </div>

  <script>
    /* ========================================================
       1. DATASET GENERATION (Simulated Backend)
       ======================================================== */
    const N = 50;
    const gData = {
      nodes: [...Array(N).keys()].map(i => ({ id: i, userAlias: 'User ' + i })),
      links: []
    };

    // Generate sparse random connections (average degree ~3)
    for (let i = 0; i < N; i++) {
        // Randomly choose 1 to 3 outgoing links for variety
        const numLinks = Math.floor(Math.random() * 3) + 1;
        for (let j = 0; j < numLinks; j++) {
            const target = Math.floor(Math.random() * N);
            if (i !== target) {
                // Ensure no duplicate links from i -> target
                if (!gData.links.some(l => l.source === i && l.target === target)) {
                    gData.links.push({ source: i, target: target });
                }
            }
        }
    }

    /* ========================================================
       2. APP STATE & VARIABLES
       ======================================================== */
    let mode = 'linkedin'; // "linkedin" or "instagram"
    let selectedNode = null;
    
    // Sets arrays to keep track of visual states
    let highlightNodes = new Set();
    let highlightLinks = new Set();
    let firstDegree = new Set();
    let secondDegree = new Set();
    let topRecs = [];
    
    // Elements
    const btnLinkedin = document.getElementById('btn-linkedin');
    const btnInstagram = document.getElementById('btn-instagram');
    const btnRun = document.getElementById('btn-run');
    const valSelected = document.getElementById('val-selected');
    const valCandidates = document.getElementById('val-candidates');
    const valTop = document.getElementById('val-top');


    /* ========================================================
       3. HELPER FUNCTIONS: GRAPH TRAVERSAL
       ======================================================== */
       
    // Retrieves standard edges based on mode
    // LinkedIn: Edges are bidirectional
    // Instagram: Edges are strictly directed (Only return nodes I follow)
    function getNeighbors(nodeId) {
        const neighbors = new Set();
        // Ignore dynamically added recommendation links
        gData.links.filter(l => !l.isRecommendation).forEach(l => {
            const s = typeof l.source === 'object' ? l.source.id : l.source;
            const t = typeof l.target === 'object' ? l.target.id : l.target;
            
            if (s === nodeId) {
                neighbors.add(t); // I follow them / we are connected
            }
            if (t === nodeId && mode === 'linkedin') {
                neighbors.add(s); // They follow me (valid in symmetric network)
            }
        });
        return neighbors;
    }

    /* ========================================================
       4. CORE LINK PREDICTION LOGIC
       ======================================================== */
    btnRun.addEventListener('click', runLinkPrediction);

    function runLinkPrediction() {
        if (!selectedNode) return;
        
        // Purge old recommendation links
        gData.links = gData.links.filter(l => !l.isRecommendation);

        // Reset visual state
        highlightNodes.clear();
        highlightLinks.clear();
        firstDegree.clear();
        secondDegree.clear();
        topRecs = [];

        // 1. Identify and highlight 1st-degree connections
        highlightNodes.add(selectedNode.id);
        const myNeighbors = getNeighbors(selectedNode.id);

        myNeighbors.forEach(nId => {
            firstDegree.add(nId);
            highlightNodes.add(nId);

            // Highlight existing base links
            gData.links.forEach(l => {
                const s = typeof l.source === 'object' ? l.source.id : l.source;
                const t = typeof l.target === 'object' ? l.target.id : l.target;
                
                if (mode === 'linkedin') {
                    if ((s === selectedNode.id && t === nId) || (t === selectedNode.id && s === nId)) {
                        highlightLinks.add(l);
                    }
                } else if (mode === 'instagram') {
                    if (s === selectedNode.id && t === nId) highlightLinks.add(l);
                }
            });
        });

        // 2. Discover 2nd-degree candidates via BFS
        const candidateScores = new Map(); // Candidate ID -> Score

        if (mode === 'linkedin') {
            // ALGORITHM: Common Neighbors & Jaccard Similarity (Symmetric)
            
            // Gather 2nd-degree candidates
            myNeighbors.forEach(nId => {
                const neighborsOfNeighbor = getNeighbors(nId);
                neighborsOfNeighbor.forEach(nnId => {
                    if (nnId !== selectedNode.id && !myNeighbors.has(nnId)) {
                        secondDegree.add(nnId);
                    }
                });
            });

            // Calculate Jaccard similarity for each candidate
            // J(A,B) = |N(A) ∩ N(B)| / |N(A) ∪ N(B)|
            secondDegree.forEach(cId => {
                const cNeighbors = getNeighbors(cId);
                let intersection = 0;
                let union = myNeighbors.size + cNeighbors.size;

                myNeighbors.forEach(x => {
                    if (cNeighbors.has(x)) intersection++;
                });

                union -= intersection; // Adjust union count correctly
                const jaccard = intersection / union;
                candidateScores.set(cId, jaccard);
            });

        } else if (mode === 'instagram') {
            // ALGORITHM: Asymmetric Follow-Back Prediction (Directed)
            
            myNeighbors.forEach(nId => {
                const theirFollowees = getNeighbors(nId);
                theirFollowees.forEach(nnId => {
                    // Suggest C to A if A doesn't already follow C
                    if (nnId !== selectedNode.id && !myNeighbors.has(nnId)) {
                        secondDegree.add(nnId);
                        // Score is based on frequency of mutual indirect connections
                        candidateScores.set(nnId, (candidateScores.get(nnId) || 0) + 1);
                    }
                });
            });
        }

        // Highlight candidates (yellow)
        secondDegree.forEach(cId => highlightNodes.add(cId));

        // 3. Determine Top 3 Recommendations by Score Rank
        topRecs = [...candidateScores.entries()]
            .sort((a,b) => b[1] - a[1])
            .slice(0, 3)
            .map(x => x[0]);

        // 4. Inject virtual links (Laser beams) for top recommendations
        topRecs.forEach(cId => {
            const targetNode = gData.nodes.find(n => n.id === cId);
            if (targetNode) {
                gData.links.push({
                    source: selectedNode,
                    target: targetNode,
                    isRecommendation: true
                });
            }
        });

        // Push data to Graph Engine to trigger visual topology update and render lasers in real-time
        Graph.graphData(gData);
        updateUI();
    }


    /* ========================================================
       5. INITIALIZE 3D FORCE GRAPH
       ======================================================== */
    const Graph = ForceGraph3D()
    (document.getElementById('3d-graph'))
        .graphData(gData)
        .backgroundColor('#050505')
        .nodeRelSize(5)
        .nodeVal(n => (firstDegree.has(n.id) ? 8 : (n === selectedNode ? 12 : 5)))
        // Render Nodes:
        // Glowing Blue: Selected
        // White: 1st Degree Neighbor
        // Yellow: 2nd Degree Candidate
        // Dim Grey: Unrelated
        .nodeColor(n => {
            if (n === selectedNode) return '#00ffff'; 
            if (firstDegree.has(n.id)) return '#ffffff';
            if (secondDegree.has(n.id)) return '#fcc419';
            return highlightNodes.size > 0 ? '#1a1a1a' : '#4dabf7'; 
        })
        .nodeOpacity(0.9)
        .nodeResolution(16)
        
        // Render Links
        .linkColor(l => {
            if (l.isRecommendation) return '#00ff00'; // Green Laser
            if (highlightLinks.has(l)) return '#888888'; // Active Path
            return highlightNodes.size > 0 ? '#111111' : '#333333'; // Dim if inactive
        })
        .linkWidth(l => l.isRecommendation ? 3 : (highlightLinks.has(l) ? 1.5 : 1))
        
        // Arrow settings for Instagram mode
        .linkDirectionalArrowLength(l => mode === 'instagram' && !l.isRecommendation ? 4 : 0)
        .linkDirectionalArrowRelPos(1)
        
        // Laser Pulse Effect Settings for Recommendations
        .linkDirectionalParticles(l => l.isRecommendation ? 5 : 0)
        .linkDirectionalParticleWidth(4)
        .linkDirectionalParticleSpeed(0.015)
        .linkDirectionalParticleColor(() => '#00ff00')

        // Camera Dynamics on Click
        .onNodeClick(node => {
            selectedNode = node;
            btnRun.disabled = false;
            resetHighlights();
            updateUI();
            
            // Aim Camera to selected node smoothly
            const distance = 150;
            const dist = Math.hypot(node.x, node.y, node.z) || 1;
            const distRatio = 1 + distance/dist;
            Graph.cameraPosition(
                { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio }, 
                node, 
                2000 // 2 seconds transition
            );
        });

    
    /* ========================================================
       6. UI / CONTROL METHODS
       ======================================================== */
    function resetHighlights() {
        highlightNodes.clear();
        highlightLinks.clear();
        firstDegree.clear();
        secondDegree.clear();
        topRecs = [];
        
        // Filter out temporary laser lines
        gData.links = gData.links.filter(l => !l.isRecommendation);
        Graph.graphData(gData); // Re-apply graph data cleanly
        
        // Trigger style re-computation
        refreshGraphVisuals();
    }

    function refreshGraphVisuals() {
        Graph.nodeColor(Graph.nodeColor())
             .nodeVal(Graph.nodeVal())
             .linkColor(Graph.linkColor())
             .linkWidth(Graph.linkWidth())
             .linkDirectionalParticles(Graph.linkDirectionalParticles())
             .linkDirectionalArrowLength(Graph.linkDirectionalArrowLength());
    }

    function updateUI() {
        if (selectedNode) {
            valSelected.innerText = `User ${selectedNode.id}`;
            valSelected.classList.add('highlight-select');
        } else {
            valSelected.innerText = 'None';
            valSelected.classList.remove('highlight-select');
        }
        
        valCandidates.innerText = secondDegree.size;
        
        if (topRecs.length > 0) {
            valTop.innerText = `User ${topRecs[0]}`;
            valTop.classList.add('highlight-metric');
        } else {
            valTop.innerText = 'None';
            valTop.classList.remove('highlight-metric');
        }
        
        refreshGraphVisuals();
    }

    // Toggle Handlers
    btnLinkedin.addEventListener('click', (e) => {
        if (mode === 'linkedin') return;
        mode = 'linkedin';
        e.target.classList.add('active');
        btnInstagram.classList.remove('active');
        selectedNode = null;
        btnRun.disabled = true;
        resetHighlights();
        updateUI();
    });

    btnInstagram.addEventListener('click', (e) => {
        if (mode === 'instagram') return;
        mode = 'instagram';
        e.target.classList.add('active');
        btnLinkedin.classList.remove('active');
        selectedNode = null;
        btnRun.disabled = true;
        resetHighlights();
        updateUI();
    });

  </script>
</body>
</html>
